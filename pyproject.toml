[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "precisionai-agrieval"
version = "0.1.0"
description = "Precision AI Agricultural Embedding API"
license = { file = "LICENSE.md" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26,<3",
    "Pillow>=10.0",
    "pydantic>=2.0",
    "tqdm>=4.64",
]

[project.optional-dependencies]
analysis = [
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "plotly>=5.0",
    "nbformat>=4.2.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "httpx2>=0.28",
]
dev = [
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "plotly>=5.0",
    "nbformat>=4.2.0",
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "httpx2>=0.28",
    "pre-commit>=3.7",
    "pyright>=1.1",
    "genbadge[coverage]>=1.1",
    "ipywidgets>=8.0",
]

[project.scripts]
precisionai-agrieval = "precisionai.agrieval.emb.api.app:main"
precisionai-agrieval-seg = "precisionai.agrieval.seg.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["precisionai*"]

[tool.pytest.ini_options]
testpaths = ["tests/emb", "tests/seg"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=precisionai --cov-report=term-missing --cov-fail-under=90"
markers = [
    "integration: marks tests that require external resources (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["precisionai"]
omit = ["*/tests/emb/*", "*/tests/seg/*", "*/__init__.py"]
relative_files = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise ImportError",
    "except ImportError",
]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportMissingImports = false
reportMissingModuleSource = false

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "N",    # pep8-naming
    "C90",  # mccabe complexity
    "D",    # pydocstyle
    "PT",   # flake8-pytest-style
    "RUF",  # ruff-specific rules
    "PL",   # pylint
    "ANN",  # flake8-annotations — enforce PEP 484 type hints
    "PERF", # perflint — performance anti-patterns
    "S",    # flake8-bandit — security linting
]
ignore = [
    "E501",    # line too long — enforced by ruff-format at 120 chars
    "B008",    # function calls in default args (FastAPI uses this pattern)
    "SIM108",  # ternary operator — sometimes less readable
    "D100",    # missing docstring in public module
    "D104",    # missing docstring in public package
    "D203",    # one-blank-line-before-class (conflicts with D211)
    "D213",    # multi-line-summary-second-line (conflicts with D212)
    "PLR0913", # too many arguments — common in evaluation functions
    "PLR2004", # magic value comparisons — acceptable in tests/metrics
    "ANN401",  # typing.Any is allowed for genuinely dynamic types
    "S311",    # pseudo-random generators are intentional in scientific code
    "S104",    # binding to 0.0.0.0 is intentional for a configurable server host
]
[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"tests/emb/**" = ["D", "PLR", "ANN", "S"]
"tests/seg/**" = ["D", "PLR", "ANN", "S"]
"docs/conf.py" = ["E402", "UP031", "ANN", "S"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["precisionai"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
