[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pai-ag-emb"
version = "0.1.0"
description = "Precision AI Agricultural Embedding API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26,<3",
    "pydantic>=2.0",
]

[project.optional-dependencies]
analysis = [
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "plotly>=5.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "httpx2>=0.28",
]
dev = [
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "plotly>=5.0",
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "httpx2>=0.28",
    "pre-commit>=3.7",
]

[project.scripts]
pai-ag-emb = "pai.ag_emb.api.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=pai --cov-report=term-missing --cov-fail-under=90"
markers = [
    "integration: marks tests that require external resources (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["pai"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise ImportError",
    "except ImportError",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line too long — handled by ruff-format
    "B008",   # function calls in default args (FastAPI uses this pattern)
    "SIM108", # ternary operator — sometimes less readable
]
per-file-ignores = {"**/__init__.py" = ["F401"]}

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
