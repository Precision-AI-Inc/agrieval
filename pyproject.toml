[build-system]
requires = ["setuptools>=61", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "precisionai-agrieval"
dynamic = ["version"]
description = "Precision AI's evaluation toolkit for agricultural computer vision models — embedding retrieval, semantic segmentation, and dense patch token diagnostics"
readme = "README.md"
license = { file = "LICENSE.md" }
authors = [{ name = "Precision AI", email = "michael@precision.ai" }]
maintainers = [{ name = "Precision AI", email = "michael@precision.ai" }]
requires-python = ">=3.10"
keywords = [
    "agriculture",
    "computer-vision",
    "dense-patch-tokens",
    "embeddings",
    "evaluation",
    "machine-learning",
    "semantic-segmentation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26,<3",
    "Pillow>=10.0",
    "pydantic>=2.0",
    "tqdm>=4.64",
]

[project.optional-dependencies]
analysis = [
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "threadpoolctl>=3.1",
    "plotly>=5.0",
    "nbformat>=4.2.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "httpx>=0.28",
]
dev = [
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "threadpoolctl>=3.1",
    "plotly>=5.0",
    "nbformat>=4.2.0",
    "nbconvert>=7.0",
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "httpx>=0.28",
    "pre-commit>=3.7",
    "pyright>=1.1",
    "genbadge[coverage]>=1.1",
    "ipywidgets>=8.0",
]

[project.scripts]
precisionai-agrieval = "precisionai.agrieval.emb.api.app:main"
precisionai-agrieval-api = "precisionai.agrieval.api.app:main"
precisionai-agrieval-seg = "precisionai.agrieval.seg.cli:main"

[project.urls]
Homepage = "https://github.com/Precision-AI-Inc/agrieval"
Repository = "https://github.com/Precision-AI-Inc/agrieval"
Issues = "https://github.com/Precision-AI-Inc/agrieval/issues"
Changelog = "https://github.com/Precision-AI-Inc/agrieval/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["precisionai*"]

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests/emb", "tests/seg", "tests/dpt"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=precisionai --cov-report=term-missing --cov-fail-under=90"
markers = [
    "integration: marks tests that require external resources (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["precisionai"]
omit = ["*/tests/emb/*", "*/tests/seg/*", "*/tests/dpt/*", "*/__init__.py"]
relative_files = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise ImportError",
    "except ImportError",
]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportMissingImports = false
reportMissingModuleSource = false

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "N",    # pep8-naming
    "C90",  # mccabe complexity
    "D",    # pydocstyle
    "PT",   # flake8-pytest-style
    "RUF",  # ruff-specific rules
    "PL",   # pylint
    "ANN",  # flake8-annotations — enforce PEP 484 type hints
    "PERF", # perflint — performance anti-patterns
    "S",    # flake8-bandit — security linting
]
ignore = [
    "E501",    # line too long — enforced by ruff-format at 120 chars
    "B008",    # function calls in default args (FastAPI uses this pattern)
    "SIM108",  # ternary operator — sometimes less readable
    "D100",    # missing docstring in public module
    "D104",    # missing docstring in public package
    "D203",    # one-blank-line-before-class (conflicts with D211)
    "D213",    # multi-line-summary-second-line (conflicts with D212)
    "PLR0913", # too many arguments — common in evaluation functions
    "PLR2004", # magic value comparisons — acceptable in tests/metrics
    "ANN401",  # typing.Any is allowed for genuinely dynamic types
    "S311",    # pseudo-random generators are intentional in scientific code
    "S104",    # binding to 0.0.0.0 is intentional for a configurable server host
    "N815",    # mixedCase metric names (mIoU, mAcc, FWIoU, mAP, nDCG) are domain-standard
]
[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"tests/emb/**" = ["D", "PLR", "ANN", "S"]
"tests/seg/**" = ["D", "PLR", "ANN", "S"]
"tests/dpt/**" = ["D", "PLR", "ANN", "S"]
"docs/conf.py" = ["E402", "UP031", "ANN", "S"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["precisionai"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
